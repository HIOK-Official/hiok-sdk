# Publishes the SDKs to the public registries when a version tag (v1.2.3) is pushed.
#
# Each registry is independent and is skipped until it is set up:
#   PyPI         trusted publisher (no secret): pypi.org > Publishing > add a pending
#                publisher: project hiok-cloud, owner HIOK-Official, repo hiok-sdk,
#                workflow publish.yml, environment pypi.
#   npm          NPM_TOKEN          granular token with publish rights on @hiok
#   NuGet        NUGET_API_KEY      nuget.org API key with "Push" for Hiok.Cloud*
#   Maven        MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  (central.sonatype.com
#                user token; namespace com.hiokcloud verified), plus GPG_PRIVATE_KEY
#                and PASSPHRASE for signing.
# The Go module needs nothing: `go get github.com/HIOK-Official/hiok-sdk/go@vX` works
# as soon as the go/vX tag exists, which this workflow also pushes.
name: publish
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    # No secret to test for: until the trusted publisher exists on PyPI this job
    # fails without failing the release.
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade build && python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with: {node-version: 22, registry-url: 'https://registry.npmjs.org'}
      - if: env.NODE_AUTH_TOKEN != ''
        working-directory: typescript
        run: |
          npm ci
          npm run build
          npm publish --provenance --access public || npm view "@hiok/cloud@$(node -p 'require(\"./package.json\").version')" version
      - if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::npm skipped - add the NPM_TOKEN secret to publish @hiok/cloud."

  nuget:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.NUGET_API_KEY != ''
      - uses: actions/setup-dotnet@v4
        if: env.NUGET_API_KEY != ''
        with: {dotnet-version: '10.0.x'}
      - if: env.NUGET_API_KEY != ''
        working-directory: dotnet/Hiok.Cloud
        run: |
          dotnet pack -c Release -o out
          dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - if: env.NUGET_API_KEY == ''
        run: echo "::notice::NuGet skipped - add the NUGET_API_KEY secret to publish Hiok.Cloud."

  maven:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        if: env.MAVEN_CENTRAL_USERNAME != ''
      - uses: actions/setup-java@v4
        if: env.MAVEN_CENTRAL_USERNAME != ''
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: env.MAVEN_CENTRAL_USERNAME != ''
        working-directory: java
        run: mvn -B -P release deploy
      - if: env.MAVEN_CENTRAL_USERNAME == ''
        run: echo "::notice::Maven Central skipped - add MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, GPG_PRIVATE_KEY and PASSPHRASE."

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the Go module (go/vX) so go get resolves it
        run: |
          t="go/${GITHUB_REF_NAME}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
            git tag "$t" && git push origin "$t"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
