[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hiok-cloud"
version = "0.3.1"
description = "Official Python SDK for HIOK Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HIOK"}]
keywords = ["hiok", "cloud", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://hiokcloud.com"
Documentation = "https://hiokcloud.com/docs"
Source = "https://github.com/HIOK-Official/hiok-sdk"

[tool.setuptools.packages.find]
where = ["src"]
